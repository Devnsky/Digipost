services:
  # =========================================================
  # Basis Data: PostgreSQL 16
  # =========================================================
  postgres:
    image: postgres:16-alpine
    container_name: digipost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digipost}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Harap setel POSTGRES_PASSWORD pada file .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-digipost}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - digipost-network

  # =========================================================
  # Layanan Email Lokal (Pengujian Reset Password via Web UI)
  # =========================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: digipost-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025" # Web UI untuk membaca email reset password
      - "1025:1025"                 # Port SMTP lokal
    networks:
      - digipost-network

  # =========================================================
  # Backend API: Node.js / Express / TypeScript
  # =========================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digipost-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-digipost}}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:${WEB_PORT:-3000}}
      COOKIE_SECRET: ${COOKIE_SECRET:?Harap setel COOKIE_SECRET minimal 32 karakter pada file .env}
      SESSION_COOKIE_NAME: digipost_session
      SESSION_IDLE_MINUTES: 30
      SESSION_MAX_HOURS: 8
      UPLOAD_DIR: /app/uploads/documents
      MAX_FILE_SIZE_MB: 25
      SEED_ON_START: ${SEED_ON_START:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@digipost.local}
    volumes:
      - uploads_data:/app/uploads/documents
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - digipost-network

  # =========================================================
  # Frontend Web: Nginx Reverse Proxy & React SPA
  # =========================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: digipost-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - digipost-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  digipost-network:
    driver: bridge

